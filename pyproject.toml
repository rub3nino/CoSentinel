[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosentinel"
version = "0.2.0"
description = "Local, SSH-based security posture & hardening orchestrator for your own machines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cosentinel" }]
keywords = ["security", "hardening", "audit", "lynis", "nmap", "nuclei", "ssh"]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cosentinel = "cosentinel.cli:main"

[tool.setuptools.packages.find]
include = ["cosentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
